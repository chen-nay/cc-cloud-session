name: Daily earnings report

on:
  schedule:
    # UTC 01:30 = 北京时间 09:30。GitHub 的定时任务是"尽力而为"，高峰期会延迟（偶尔几个小时），
    # 整点最拥挤，所以不放在整点
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "使用示例数据（用来测试微信推送，不需要 Finnhub key）"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write # 发布报告图片到 GitHub Pages
  id-token: write

concurrency:
  group: daily-earnings
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 截图需要浏览器和中文字体；失败也不要紧，会退回只推送文字版
      - name: Install Chinese fonts and Chromium
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Build report and image
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: >-
          python -m earnings_watch --dry-run
          --site-dir site
          --site-url "${{ steps.pages.outputs.base_url }}"
          ${{ inputs.sample && '--sample' || '' }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Push to WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: >-
          python -m earnings_watch --send output/message.json
          ${{ steps.deployment.outcome != 'success' && '--text-only' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ github.run_id }}
          path: |
            output/
            site/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify failure
        if: failure()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: >-
          python -m earnings_watch --alert
          "今天的财报日历没有成功生成，查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
